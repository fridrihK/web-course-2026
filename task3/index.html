<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №3 — Todo List</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>
    <div class="todo-container">
        <h1>Список задач</h1>

        
        <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="Введите текст задачи..." autocomplete="off">
            <button type="submit" id="add-btn">Добавить</button>
        </form>

        <p id="error-message" class="error-message hidden">Пожалуйста, введите текст задачи!</p>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        
        <div class="counter" id="counter">
            Осталось: <span id="active-count">0</span>, Выполнено: <span id="completed-count">0</span>
        </div>

        
        <ul id="todo-list" class="todo-list"></ul>
    </div>
</body>
</html>
